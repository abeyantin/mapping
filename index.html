<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Maryhill Derelict Land</title>
  <meta name="description" content="An interactive map of derelict land sites in Maryhill, Glasgow.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-map">
  <header class="site-header">
    <a class="brand" href="index.html">Maryhill <span>Derelict Land</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Map</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="map-wrap">
    <div id="map" aria-label="Map of derelict land sites in Maryhill"></div>

    <div class="legend">
      <span class="swatch" aria-hidden="true"></span>
      <span><strong id="site-count">–</strong> derelict sites</span>
      <span class="legend-hint">Tap a site to explore</span>
    </div>

    <aside id="panel" class="panel" aria-hidden="true" aria-labelledby="panel-title">
      <div class="panel-grip" aria-hidden="true"></div>
      <button class="panel-close" type="button" aria-label="Close">&times;</button>
      <div class="panel-body">
        <p class="panel-kicker"><span id="panel-number"></span> <span id="panel-status"></span></p>
        <h2 id="panel-title"></h2>
        <dl class="panel-facts">
          <div><dt>Area</dt><dd id="panel-area"></dd></div>
        </dl>
        <div id="panel-images" class="panel-images"></div>
        <div id="panel-description" class="panel-description"></div>
      </div>
      <div class="panel-nav">
        <button type="button" id="prev-site">&larr; Previous</button>
        <button type="button" id="next-site">Next &rarr;</button>
      </div>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
